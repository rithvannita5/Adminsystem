<!DOCTYPE html>
<html lang="km">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#FFD700">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចូលប្រើប្រាស់ - ប្រព័ន្ធគ្រប់គ្រងរដ្ឋបាល</title>
    <link href="https://fonts.googleapis.com/css2?family=Khmer&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Khmer', 'Khmer OS', sans-serif;
            background: #0f1123;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: #1a1a2e;
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .login-logo img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 50%;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.05);
            padding: 5px;
        }

        .login-logo .logo-icon {
            font-size: 60px;
            display: block;
            margin-bottom: 10px;
            color: #FFD700;
        }

        .login-logo .brand-name {
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
            display: block;
        }

        .divider {
            height: 1px;
            background: rgba(255, 215, 0, 0.2);
            margin: 15px 0 20px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #e0e0e0;
            font-size: 13px;
        }

        .form-group .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: #252542;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 14px;
            color: #FFD700;
            font-size: 15px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 14px;
            font-family: 'Khmer', sans-serif;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #FFD700;
            color: #0a0a0f;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Khmer', sans-serif;
            margin-top: 10px;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #e6c200;
        }

        .error-message {
            background: rgba(231, 76, 60, 0.2);
            color: #ff6b6b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
            border: 1px solid #e74c3c;
        }

        .forgot-password-link {
            text-align: right;
            margin-top: 8px;
        }

        .forgot-password-link a {
            color: #4dabf7;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
        }

        .forgot-password-link a:hover {
            text-decoration: underline;
        }

        .login-footer {
            margin-top: 20px;
            color: rgba(255,255,255,0.4);
            font-size: 12px;
        }
        
        .login-footer strong {
            color: #FFD700;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-logo">
            <img src="/static/Logo.png" alt="Logo" onerror="this.style.display='none'; document.getElementById('altLogo').style.display='block';">
            <span id="altLogo" class="logo-icon" style="display:none;">📊</span>
            <span class="brand-name">ប្រព័ន្ធគ្រប់គ្រងរដ្ឋបាល</span>
        </div>

        <div class="divider"></div>

        {% if error %}
        <div class="error-message">
            <i class="fas fa-exclamation-circle"></i> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label><i class="fas fa-user"></i> ឈ្មោះអ្នកប្រើប្រាស់</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" placeholder="admin" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label><i class="fas fa-lock"></i> ពាក្យសម្ងាត់</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="login-btn">
                <i class="fas fa-sign-in-alt"></i> ចូលប្រើប្រាស់
            </button>
        </form>

        <div class="login-footer">
            <p>ទំនាក់ទំនងលោក៖ <strong>សែត ពៅ</strong></p>
        </div>
    </div>

</body>
</html>
