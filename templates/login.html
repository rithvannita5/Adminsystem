<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចូលប្រើប្រាស់ប្រព័ន្ធ</title>
    <link href="https://fonts.googleapis.com/css2?family=Khmer&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Khmer', sans-serif; background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .login-card { background: #ffffff; padding: 35px 30px; border-radius: 15px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        h2 { color: #1a1a2e; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #333; font-size: 14px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #1a237e; color: white; border: none; border-radius: 8px; font-size: 16px; font-family: 'Khmer', sans-serif; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0d1442; }
        .error { color: #d93025; font-size: 13px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>📊 ចូលប្រើប្រាស់ប្រព័ន្ធ</h2>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="form-group">
                <label>ឈ្មោះអ្នកប្រើប្រាស់ (Username)</label>
                <input type="text" name="username" required placeholder="admin">
            </div>
            <div class="form-group">
                <label>ពាក្យសម្ងាត់ (Password)</label>
                <input type="password" name="password" required placeholder="password123">
            </div>
            <button type="submit">ចូលប្រព័ន្ធ</button>
        </form>
    </div>
</body>
</html>
