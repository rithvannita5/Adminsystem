    <title>ចូលប្រើប្រាស់ - ប្រព័ន្ធគ្រប់គ្រងរដ្ឋបាល</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Khmer&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Khmer', 'Khmer OS', 'Moul', 'Arial', sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(255, 215, 0, 0.03) 0%, transparent 70%);
            animation: rotateBackground 30s linear infinite;
        }

        @keyframes rotateBackground {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            padding: 45px 40px 40px;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            width: 420px;
            max-width: 92%;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255,255,255,0.08);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .login-logo img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            border-radius: 16px;
            margin-bottom: 12px;
        }

        .login-logo .logo-icon {
            font-size: 60px;
            display: block;
            margin-bottom: 10px;
            color: #FFD700;
        }

        .login-logo .brand-name {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            font-family: 'Khmer OS', 'Khmer', 'Moul', serif;
            display: block;
            line-height: 1.3;
        }

        .login-logo .brand-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.35);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 4px;
            display: block;
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255,215,0,0.3), transparent);
            margin: 20px 0 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.7);
            font-weight: bold;
            font-size: 14px;
            font-family: 'Khmer', 'Khmer OS', sans-serif;
            letter-spacing: 0.5px;
        }

        .form-group .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.08);
            transition: all 0.3s;
        }

        .form-group .input-wrapper:focus-within {
            border-color: #FFD700;
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.1);
        }

        .form-group .input-wrapper i {
            position: absolute;
            left: 15px;
            color: rgba(255,255,255,0.3);
            font-size: 16px;
            transition: color 0.3s;
        }

        .form-group .input-wrapper:focus-within i {
            color: #FFD700;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px 14px 48px;
            background: transparent;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Khmer', 'Khmer OS', sans-serif;
            color: #ffffff;
            outline: none;
            transition: all 0.3s;
        }

        .form-group input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .form-group input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px rgba(10,10,15,0.9) inset !important;
            -webkit-text-fill-color: #ffffff !important;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #0a0a0f;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Khmer', 'Khmer OS', sans-serif;
            letter-spacing: 1px;
            margin-top: 5px;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.25);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn i {
            margin-right: 10px;
        }

        .forgot-password-link {
            text-align: right;
            margin-top: 8px;
            margin-bottom: 5px;
        }

        .forgot-password-link a {
            color: #4A90D9;
            font-size: 13px;
            font-family: 'Khmer', 'Khmer OS', sans-serif;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .forgot-password-link a:hover {
            color: #1a73e8;
            text-decoration: underline;
        }

        .forgot-password-link a i {
            margin-right: 5px;
            font-size: 12px;
        }

        .error-message {
            background: rgba(231, 76, 60, 0.15);
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(231, 76, 60, 0.2);
            font-family: 'Khmer', 'Khmer OS', sans-serif;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .success-message {
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(46, 204, 113, 0.2);
            font-family: 'Khmer', 'Khmer OS', sans-serif;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-footer {
            text-align: center;
            margin-top: 22px;
        }

        .login-footer .test-account {
            color: rgba(255,255,255,0.3);
            font-size: 13px;
            font-family: 'Khmer', 'Khmer OS', sans-serif;
        }

        .login-footer .test-account strong {
            color: rgba(255,215,0,0.5);
            font-weight: 600;
        }

        /* ===== OTP MODAL ===== */
        .modal-otp {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-otp.active {
            display: flex;
        }

        .modal-otp .modal-content {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            padding: 35px 30px;
            border-radius: 20px;
            max-width: 420px;
            width: 100%;
            position: relative;
            animation: modalSlideDown 0.3s ease;
            border: 1px solid rgba(255,255,255,0.08);
        }

        @keyframes modalSlideDown {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-otp .modal-close {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 28px;
            cursor: pointer;
            color: rgba(255,255,255,0.3);
            transition: color 0.3s;
            background: none;
            border: none;
        }

        .modal-otp .modal-close:hover {
            color: #e74c3c;
        }

        .modal-otp .modal-title {
            color: #ffffff;
            font-family: 'Khmer', 'Khmer OS', sans-serif;
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 15px;
        }

        .modal-otp .modal-title i {
            color: #FFD700;
            margin-right: 10px;
        }

        .modal-otp .form-group label {
            color: rgba(255,255,255,0.6);
            font-size: 13px;
        }

        .modal-otp .form-group input {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.08);
            color: #ffffff;
            padding: 12px 15px;
            width: 100%;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Khmer', 'Khmer OS', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }

        .modal-otp .form-group input:focus {
            border-color: #FFD700;
        }

        .modal-otp .form-group input::placeholder {
            color: rgba(255,255,255,0.2);
        }

        .modal-otp .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #0a0a0f;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Khmer', 'Khmer OS', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 5px;
        }

        .modal-otp .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,215,0,0.3);
        }

        .modal-otp .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
